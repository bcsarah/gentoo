# MAKEFILE
COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="${RUSTFLAGS} -C target-cpu=native"

MAKEOPTS="-j8 -l8"
FEATURES="ccache"
INPUT_DEVICES="libinput"
VIDEO_CARDS="intel"
ACCEPT_KEYWORDS="~amd64"
PYTHON_SINGLE_TARGET="python3_13"

USE="X alsa pipewire bluetooth \
     -systemd -wayland -gnome -kde -pulseaudio \
     -cdda -dvd -cdr -bluray -optical -avahi -cups -emacs"

# DIRS
PORTDIR="/var/db/repos/gentoo"
PORTDIR_OVERLAY="/usr/local/portage"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
CCACHE_DIR="/var/cache/ccache"

# Please keep this setting intact when reporting bugs.
EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --jobs=12 --load-average=12"
GENTOO_MIRRORS="https://gentoo.c3sl.ufpr.br/"
GRUB_PLATFORMS="efi-64"
LC_MESSAGES=C.UTF-8
